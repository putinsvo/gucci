name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyQt6 ultralytics mss python-chess pydirectinput pygetwindow
        
    - name: Build with PyInstaller
      run: pyinstaller --noconfirm --onefile --windowed --name "ChessOverlay" --hidden-import PyQt6 --collect-all PyQt6 --collect-all ultralytics --add-data "assets;assets" --add-data "runs/chess/train/weights/best.pt;." --add-data "detect_custom.py;." main.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChessOverlay-Windows
        path: dist/ChessOverlay.exe